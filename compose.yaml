name: orderflow

services:
  postgres:
    image: postgres:18-alpine
    container_name: orderflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: orderflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: orderflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic orderflow.orders --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic orderflow.orders.dlq --partitions 1 --replication-factor 1
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: orderflow-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: orderflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    restart: unless-stopped

  api-migrations:
    build:
      context: .
      dockerfile: src/OrderFlow.Api/Dockerfile
      target: migrations
    image: orderflow/api-migrations
    container_name: orderflow-api-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__OrderFlow: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/OrderFlow.Api/Dockerfile
      target: final
    image: orderflow/api
    container_name: orderflow-api
    depends_on:
      api-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__OrderFlow: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Kafka__BootstrapServers: kafka:29092
      OpenApi__Enabled: "true"
    ports:
      - "127.0.0.1:${API_PORT:-5100}:8080"
    restart: unless-stopped

  warehouse:
    build:
      context: .
      dockerfile: src/OrderFlow.WarehouseStub/Dockerfile
      target: final
    image: orderflow/warehouse-stub
    container_name: orderflow-warehouse
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-5110}:8080"
    restart: unless-stopped

  consumer-migrations:
    build:
      context: .
      dockerfile: src/OrderFlow.Consumer/Dockerfile
      target: migrations
    image: orderflow/consumer-migrations
    container_name: orderflow-consumer-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__ConsumerDb: Host=postgres;Port=5432;Database=${POSTGRES_DB}_consumer;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    restart: "no"

  consumer:
    build:
      context: .
      dockerfile: src/OrderFlow.Consumer/Dockerfile
      target: final
    image: orderflow/consumer
    container_name: orderflow-consumer
    depends_on:
      consumer-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConsumerDb: Host=postgres;Port=5432;Database=${POSTGRES_DB}_consumer;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Kafka__BootstrapServers: kafka:29092
      Warehouse__BaseUrl: http://warehouse:8080/
    ports:
      - "127.0.0.1:${CONSUMER_PORT:-5120}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
